<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efe4cc">
  <meta name="description" content="Sorisketch — 판소리 다섯 바탕을 골라, 내 선택으로 새로 짜는 평행세계 판소리. 그림과 장단, 추임새로 함께하는 소리판.">
  <title>Sorisketch · 판을 바꾸다</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <button class="icon-btn" id="btn-home" aria-label="처음으로">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
    <div class="brand-mini">Sorisketch</div>
    <div class="top-actions">
      <span class="mode-chip" id="mode-chip"></span>
      <button class="icon-btn" id="btn-mute" aria-label="소리 끄기">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="cross" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" aria-label="설정">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <dialog id="settings" class="sheet">
    <form method="dialog">
      <h2>설정</h2>
      <label class="row">음량 <input type="range" id="set-volume" min="0" max="1" step="0.05" value="0.8"></label>
      <label class="row check"><input type="checkbox" id="set-tts"> 아니리 소리 내어 읽기 <small>(기기의 일반 음성 합성)</small></label>
      <label class="row check"><input type="checkbox" id="set-large"> 글자 크게</label>
      <label class="row check"><input type="checkbox" id="set-guide" checked> 추임새 자리 안내 보이기</label>
      <p class="note">소리를 켤 수 없는 곳에서도 그림과 자막으로 진행할 수 있지만, 이 소리판은 <b>장단과 가락을 들어 보는 것</b>이 핵심이에요.</p>
      <button class="btn primary" value="close">닫기</button>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
